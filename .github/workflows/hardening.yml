name: One-time release hardening
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  harden:
    if: contains(github.event.head_commit.message, '[harden-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python3 scripts/apply-hardening.py
      - run: npm ci
      - name: Inspect dependency advisories
        run: |
          npm audit --json > /tmp/trade-audit.json || true
          node -e "const a=require('/tmp/trade-audit.json');console.log(JSON.stringify({metadata:a.metadata,vulnerabilities:a.vulnerabilities},null,2))"
      - run: npm test && npm run build
      - run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Save tested source changes and preview screenshots
        run: |
          mkdir -p docs/screenshots
          cp test-results/desktop-market.png docs/screenshots/desktop-market.png
          cp test-results/mobile-market.png docs/screenshots/mobile-market.png
          cp test-results/desktop-case.png docs/screenshots/desktop-case.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server src docs/screenshots
          git commit -m 'fix: enforce independent review, immutable originals and atomic attachment gates'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardening-results
          path: |
            playwright-report/
            test-results/
