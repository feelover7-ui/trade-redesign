name: Image dependency security update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: contains(github.event.head_commit.message, '[upgrade-image-codec]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install advisory-fixed image codec
        run: npm install --save-exact sharp@0.35.5
      - name: Require clean dependency audit
        run: npm audit --audit-level=low
      - run: npm test && npm run build
      - run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Commit verified lock and remove temporary build helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hardening.yml scripts/apply-hardening.py
          git add package.json package-lock.json
          git commit -m 'security: upgrade sharp to 0.35.5 and remove temporary maintenance workflows'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-qa
          path: |
            playwright-report/
            test-results/
