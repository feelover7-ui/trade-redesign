name: Trade CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[harden-once]')"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Domain, concurrency and HTTP security tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser acceptance and responsive tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trade-qa-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Package runnable source with built frontend
        if: success()
        run: |
          mkdir -p /tmp/trade-package
          git archive HEAD | tar -x -C /tmp/trade-package
          cp -R dist /tmp/trade-package/dist
          tar -czf trade-mvp-source-and-build.tar.gz -C /tmp/trade-package .
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: trade-mvp-source-and-build
          path: trade-mvp-source-and-build.tar.gz
          retention-days: 14
